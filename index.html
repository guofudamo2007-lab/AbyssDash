<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>深渊冲刺 V3.3 (细节打磨版)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
            -webkit-touch-callout: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            max-width: 100vw;
            max-height: 100vh;
        }
        canvas {
            background: linear-gradient(180deg, #101f42 0%, #0a1128 50%, #030511 100%);
            display: block;
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            z-index: 999; 
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #left-ui { display: flex; flex-direction: column; }
        #score-box { font-size: clamp(16px, 4vw, 24px); font-weight: bold; text-shadow: 0 0 10px rgba(0,255,255,0.5); display: flex; align-items: baseline; }
        #multiplier { color: #ffd700; font-size: clamp(14px, 3.5vw, 20px); margin-left: 10px; text-shadow: 0 0 15px #ffaa00; opacity: 0; transition: opacity 0.2s; }
        #multiplier.active { opacity: 1; animation: pulse 0.5s infinite alternate; }
        #best-score-box { font-size: clamp(12px, 3vw, 16px); color: #ffd700; margin-top: 5px; text-shadow: 0 0 5px #ffaa00; font-weight: bold; }
        
        #hunt-bar-container { width: clamp(100px, 30vw, 180px); height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 10px; border: 1px solid rgba(0,255,255,0.2); overflow: hidden; }
        #hunt-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00ffff, #0088ff); box-shadow: 0 0 10px #00ffff; transition: width 0.1s; }
        
        #pause-btn {
            pointer-events: auto;
            font-size: clamp(20px, 5vw, 28px);
            cursor: pointer;
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 8px;
            width: 44px; height: 44px;
            display: none; 
            justify-content: center; align-items: center;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
            transition: transform 0.1s, opacity 0.3s;
        }
        #pause-btn:active { transform: scale(0.9); }

        .blood-screen { animation: flashRed 0.6s ease-out forwards; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }
        @keyframes flashRed { 0% { box-shadow: inset 0 0 100px rgba(255, 0, 0, 1); } 40% { box-shadow: inset 0 0 80px rgba(255, 0, 0, 0.8); } 100% { box-shadow: inset 0 0 150px rgba(255, 0, 0, 0.4); } }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div id="left-ui">
                <div id="score-box">DEPTH SCORE: <span id="score" style="margin-left: 5px;">0</span><span id="multiplier">x2 RUSH!</span></div>
                <div id="best-score-box">BEST DEPTH: <span id="high-score">0</span></div>
                <div style="font-size: 12px; margin-top: 10px; color: #8ab;">HUNTING LEVEL:</div>
                <div id="hunt-bar-container"><div id="hunt-bar"></div></div>
            </div>
            <div id="pause-btn">⏸</div>
        </div>
        <canvas id="gameCanvas" width="850" height="450"></canvas>
    </div>
    
<script>
const CONFIG = {
    INITIAL_SPEED: 2.3,   
    MAX_BASE_SPEED: 5.5,  
    SPEED_GROWTH: 0.002,  
    SPEED_HARD_CAP: 12.0, 

    BUOYANCY: 0.15,     
    DIVE_FORCE: 0.3,    
    MAX_VELOCITY: 4.0,
    LOGIC_FPS: 120, 
    FRAME_TIME: 1000 / 120
};

class AudioManager {
    constructor() { this.ctx = null; }
    init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
    }
    play(type) {
        if (!this.ctx) return;
        let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
        osc.connect(gain); gain.connect(this.ctx.destination);
        let now = this.ctx.currentTime;

        switch (type) {
            case 'eat':
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1); break;
            case 'dash':
                osc.type = 'triangle'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
                gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
                osc.start(now); osc.stop(now + 0.4); break;
            case 'crash':
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.3);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3); break;
            case 'smash':
                osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.15);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15); break;
            case 'shock':
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2); break;
        }
    }
}

class UIManager {
    constructor() {
        this.scoreEl = document.getElementById('score');
        this.highScoreEl = document.getElementById('high-score');
        this.huntBar = document.getElementById('hunt-bar');
        this.multiplierEl = document.getElementById('multiplier');
        this.pauseBtn = document.getElementById('pause-btn');
        this.container = document.getElementById('game-container');
    }
    setPauseBtnVisible(isVisible) { this.pauseBtn.style.display = isVisible ? 'flex' : 'none'; }
    updatePauseBtnIcon(isPaused) { this.pauseBtn.innerText = isPaused ? '▶️' : '⏸'; }
    update(score, shark, highScore) {
        this.scoreEl.innerText = score;
        this.highScoreEl.innerText = highScore;

        if (shark.inCurrent) this.multiplierEl.classList.add('active');
        else this.multiplierEl.classList.remove('active');

        if (shark.isDashing) {
            this.huntBar.style.width = (shark.dashTimer / 120 * 100) + '%';
            this.huntBar.style.background = 'linear-gradient(90deg, #ff0055, #ff0000)';
            this.huntBar.style.boxShadow = '0 0 15px #ff0000';
        } else {
            this.huntBar.style.width = Math.min(shark.huntPoints, 100) + '%';
            this.huntBar.style.background = 'linear-gradient(90deg, #00ffff, #0088ff)';
            this.huntBar.style.boxShadow = '0 0 10px #00ffff';
        }
    }
    triggerBloodScreen() { this.container.classList.add('blood-screen'); }
    clearBloodScreen() { this.container.classList.remove('blood-screen'); }
}

class Renderer {
    constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
    }
    draw(engine) {
        const { ctx, canvas } = this;
        const shark = engine.shark;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let gradient = ctx.createLinearGradient(canvas.width/2, 0, canvas.width/2, canvas.height);
        gradient.addColorStop(0, 'rgba(0, 255, 255, 0.08)'); gradient.addColorStop(0.3, 'rgba(0, 100, 255, 0.03)'); gradient.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gradient; ctx.beginPath();
        ctx.moveTo(150 + Math.sin(engine.frameCount*0.02)*40, 0); ctx.lineTo(280 + Math.sin(engine.frameCount*0.02)*40, 0);
        ctx.lineTo(450 + Math.sin(engine.frameCount*0.015)*60, canvas.height); ctx.lineTo(200 + Math.sin(engine.frameCount*0.015)*60, canvas.height);
        ctx.fill();

        engine.currentZones.forEach(cz => {
            let streamGrad = ctx.createLinearGradient(0, cz.y, 0, cz.y + cz.h);
            streamGrad.addColorStop(0, 'rgba(0, 255, 255, 0)'); streamGrad.addColorStop(0.5, 'rgba(0, 255, 255, 0.25)'); streamGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
            ctx.fillStyle = streamGrad; ctx.fillRect(cz.x, cz.y, cz.w, cz.h);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            for(let j=0; j<4; j++) { let lineX = cz.x + ((engine.frameCount*8 + j*400) % cz.w); ctx.fillRect(lineX, cz.y + 15 + j*18, 60, 2); }
        });

        engine.planks.forEach(p => { ctx.fillStyle = `rgba(150, 255, 255, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); });
        if (shark.isDashing || shark.inCurrent) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            for(let i=0; i<12; i++) { ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 150 + 50, 1.5); }
        }

        ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ff';
        engine.jellyfishes.forEach(jelly => {
            ctx.fillStyle = 'rgba(255, 100, 255, 0.7)'; ctx.beginPath(); ctx.arc(jelly.x, jelly.y, jelly.radius, Math.PI, 0); ctx.fill();
            ctx.strokeStyle = 'rgba(255, 100, 255, 0.6)'; ctx.lineWidth = 2;
            for(let t = -1; t <= 1; t++) {
                ctx.beginPath(); ctx.moveTo(jelly.x + t * 8, jelly.y);
                ctx.lineTo(jelly.x + t * 8 + Math.sin(engine.frameCount*0.1 + jelly.offset)*4, jelly.y + 15); ctx.lineTo(jelly.x + t * 8, jelly.y + 30); ctx.stroke();
            }
        });
        ctx.shadowBlur = 0;

        engine.fishes.forEach(fish => {
            if (fish.active) {
                ctx.fillStyle = '#00ffff'; ctx.shadowBlur = 12; ctx.shadowColor = '#00ffff';
                ctx.beginPath(); ctx.arc(fish.x, fish.y, fish.radius, 0, Math.PI * 2); ctx.fill();
            }
        });
        ctx.shadowBlur = 0; 

        ctx.fillStyle = '#09081a'; ctx.strokeStyle = '#1a183a'; ctx.lineWidth = 3;
        engine.obstacles.forEach(obs => {
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height); ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            ctx.fillStyle = '#12112d';
            if(obs.type === 'bottom') ctx.fillRect(obs.x + 5, obs.y + 10, obs.width - 10, 10);
            else ctx.fillRect(obs.x + 5, obs.y + obs.height - 20, obs.width - 10, 10);
            ctx.fillStyle = '#09081a';
        });

        ctx.save(); ctx.translate(shark.x, shark.y);
        if (shark.isDashing || shark.inCurrent) ctx.scale(1.2, 0.9); 
        if (shark.isParalyzed) {
            ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 2; ctx.beginPath();
            ctx.arc(shark.width/2 + (Math.random()*4-2), Math.random()*4-2, shark.radius + 6, 0, Math.PI*2); ctx.stroke();
        }
        if (shark.isDashing) {
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)'; ctx.lineWidth = 4; ctx.shadowBlur = 25; ctx.shadowColor = 'red';
            ctx.beginPath(); ctx.arc(shark.width/2, 0, shark.radius * 1.8 + Math.sin(engine.frameCount*0.3)*4, 0, Math.PI*2); ctx.stroke();
        } else if (shark.inCurrent) {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.6)'; ctx.lineWidth = 3; ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff';
            ctx.beginPath(); ctx.arc(shark.width/2, 0, shark.radius * 1.6, 0, Math.PI*2); ctx.stroke();
        }

        ctx.fillStyle = shark.isDashing ? '#3a0005' : (shark.isParalyzed ? '#2a002a' : '#03030a');
        if(shark.isDashing) { ctx.shadowBlur = 15; ctx.shadowColor = 'red'; } else if (shark.inCurrent) { ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; }
        
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(shark.width * 0.3, -shark.height * 0.7, shark.width * 0.7, -shark.height * 0.5); 
        ctx.lineTo(shark.width, 0); ctx.quadraticCurveTo(shark.width * 0.6, shark.height * 0.6, 0, 0); ctx.fill();

        ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(shark.width - 6, -1);
        ctx.lineTo(shark.width - 12, -4); ctx.lineTo(shark.width - 10, 2); ctx.lineTo(shark.width - 15, 3); ctx.fill();

        ctx.fillStyle = shark.isDashing ? '#ff0000' : (shark.inCurrent ? '#ffffff' : (shark.isParalyzed ? '#ff00ff' : '#33ffaa'));
        ctx.beginPath(); ctx.arc(shark.width - 14, -3, 2.5, 0, Math.PI * 2); ctx.fill();
        ctx.restore(); ctx.shadowBlur = 0;

        // === 修复与新增：UI 提示与状态呈现 ===
        if (engine.state === 'READY') {
            ctx.fillStyle = 'rgba(5, 5, 15, 0.6)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffff'; ctx.font = 'bold clamp(20px, 5vw, 32px) sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('准备潜入深渊', canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.fillStyle = '#ffffff'; ctx.font = 'clamp(12px, 3vw, 16px) sans-serif';
            ctx.fillText('轻按 屏幕/空格键 下潜，松开上浮', canvas.width / 2, canvas.height / 2 + 30);
            
            // 新增：新手引导提示
            ctx.fillStyle = '#00ffff'; ctx.font = 'clamp(10px, 2.5vw, 14px) sans-serif';
            ctx.fillText('🦈 吃小鱼积攒怒气 → 满怒触发冲刺（无敌+破障）', canvas.width / 2, canvas.height / 2 + 65);
            
        } else if (engine.state === 'PAUSED') {
            ctx.fillStyle = 'rgba(5, 5, 15, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffff'; ctx.font = 'bold clamp(24px, 6vw, 36px) sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = '#ffffff'; ctx.font = 'clamp(12px, 3vw, 16px) sans-serif';
            ctx.fillText('点击继续游戏', canvas.width / 2, canvas.height / 2 + 40);
            
        } else if (engine.state === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(5, 5, 15, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff3333'; ctx.font = 'bold clamp(24px, 6vw, 36px) sans-serif'; ctx.textAlign = 'center';
            ctx.fillText('ABYSS CRASHED', canvas.width / 2, canvas.height / 2 - 40);
            
            if (engine.isNewRecord) {
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold clamp(16px, 4vw, 24px) sans-serif';
                ctx.fillText(`🎉 新纪录产生: ${engine.score} 🎉`, canvas.width / 2, canvas.height / 2 + 10);
            } else {
                ctx.fillStyle = '#ffffff'; ctx.font = 'clamp(14px, 3.5vw, 20px) sans-serif';
                ctx.fillText(`最终得分: ${engine.score}`, canvas.width / 2, canvas.height / 2 + 10);
            }
            ctx.fillStyle = '#ffffff'; ctx.font = 'clamp(12px, 3vw, 16px) sans-serif';
            ctx.fillText('点击屏幕 或 按【空格键】重返深渊', canvas.width / 2, canvas.height / 2 + 90);
        }
    }
}

class GameEngine {
    constructor() {
        this.audio = new AudioManager();
        this.ui = new UIManager();
        this.renderer = new Renderer('gameCanvas');
        
        this.state = 'READY'; 
        this.highScore = localStorage.getItem('abyssDashHighScore') || 0;
        this.isPressing = false;
        
        this.lastTime = 0;
        this.accumulator = 0;

        this.initEntities();
        this.bindEvents();
        
        requestAnimationFrame((time) => this.loop(time));
    }

    initEntities() {
        this.shark = { x: 120, y: 225, width: 50, height: 24, radius: 14, velocity: 0, huntPoints: 0, isDashing: false, dashTimer: 0, inCurrent: false, isParalyzed: false, paralyzeTimer: 0 };
        this.obstacles = []; this.fishes = []; this.currentZones = []; this.jellyfishes = []; this.planks = [];
        this.score = 0; this.frameCount = 0; this.isNewRecord = false;
        
        for(let i=0; i<25; i++) {
            this.planks.push({ x: Math.random() * this.renderer.canvas.width, y: Math.random() * this.renderer.canvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.2, alpha: Math.random() * 0.5 + 0.2 });
        }
        
        this.ui.clearBloodScreen();
        this.ui.setPauseBtnVisible(false);
        this.ui.updatePauseBtnIcon(false);
        this.ui.update(this.score, this.shark, this.highScore);
    }

    bindEvents() {
        const handleInputDown = () => {
            this.audio.init();
            if (this.state === 'GAMEOVER') {
                this.state = 'READY'; this.initEntities(); return;
            }
            if (this.state === 'PAUSED') {
                this.resume(); return;
            }
            if (this.state === 'READY') {
                this.state = 'PLAYING';
                this.ui.setPauseBtnVisible(true); 
                this.lastTime = performance.now();
                this.accumulator = 0;
            }
            this.isPressing = true;
        };

        const handleInputUp = () => { this.isPressing = false; };

        this.ui.pauseBtn.addEventListener('mousedown', (e) => { e.stopPropagation(); this.togglePause(); });
        this.ui.pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); this.togglePause(); }, {passive: false});

        window.addEventListener('mousedown', handleInputDown);
        window.addEventListener('touchstart', (e) => { e.preventDefault(); handleInputDown(); }, {passive: false});
        window.addEventListener('mouseup', handleInputUp);
        window.addEventListener('touchend', (e) => { e.preventDefault(); handleInputUp(); }, {passive: false});
        window.addEventListener('keydown', (e) => { if(e.code === 'Space') { e.preventDefault(); handleInputDown(); }});
        window.addEventListener('keyup', (e) => { if(e.code === 'Space') handleInputUp(); });
    }

    togglePause() {
        if (this.state === 'PLAYING') {
            this.state = 'PAUSED';
            this.ui.updatePauseBtnIcon(true);
            this.renderer.draw(this); 
        } else if (this.state === 'PAUSED') {
            this.resume();
        }
    }

    resume() {
        this.state = 'PLAYING';
        this.ui.updatePauseBtnIcon(false);
        this.lastTime = performance.now(); 
    }

    triggerGameOver() {
        this.state = 'GAMEOVER'; 
        this.ui.setPauseBtnVisible(false); 
        this.audio.play('crash');
        this.ui.triggerBloodScreen();
        
        if (this.score > this.highScore && this.score > 0) {
            this.highScore = this.score;
            localStorage.setItem('abyssDashHighScore', this.highScore);
            this.isNewRecord = true;
        }

        // === 修复 1：游戏结束时立即同步最新最高分 UI ===
        this.ui.update(this.score, this.shark, this.highScore);

        let shake = 14;
        let shakeInterval = setInterval(() => {
            this.renderer.canvas.style.transform = `translate(${Math.random()*shake - shake/2}px, ${Math.random()*shake - shake/2}px)`;
            shake *= 0.9;
            if(shake <= 0.5) { clearInterval(shakeInterval); this.renderer.canvas.style.transform = 'translate(0, 0)'; }
        }, 30);
    }

    checkCollision(cx, cy, radius, rx, ry, rw, rh) {
        let nearX = Math.max(rx, Math.min(cx, rx + rw)); let nearY = Math.max(ry, Math.min(cy, ry + rh));
        let dx = cx - nearX; let dy = cy - nearY;
        return (dx * dx + dy * dy) < (radius * radius);
    }

    updateLogic() {
        this.frameCount++;
        let cvsW = this.renderer.canvas.width;
        let cvsH = this.renderer.canvas.height;
        
        let dynamicBaseSpeed = Math.min(CONFIG.MAX_BASE_SPEED, CONFIG.INITIAL_SPEED + this.score * CONFIG.SPEED_GROWTH);

        let wasInCurrent = this.shark.inCurrent;
        this.shark.inCurrent = false;
        let sharkCX = this.shark.x + this.shark.width / 2;
        let sharkCY = this.shark.y;
        
        this.currentZones.forEach(cz => {
            if (sharkCX > cz.x && sharkCX < cz.x + cz.w && sharkCY > cz.y && sharkCY < cz.y + cz.h) this.shark.inCurrent = true;
        });

        if (this.shark.inCurrent && !wasInCurrent && !this.shark.isDashing) this.audio.play('dash');

        let isInvincible = this.shark.isDashing || this.shark.inCurrent;
        if (this.shark.isParalyzed) {
            this.shark.paralyzeTimer--;
            if (this.shark.paralyzeTimer <= 0 || isInvincible) this.shark.isParalyzed = false; 
        }

        let speedMult = 1;
        if (this.shark.isDashing) speedMult *= 2.5;
        if (this.shark.inCurrent) speedMult *= 2.0;
        if (this.shark.isParalyzed && !isInvincible) speedMult *= 0.6; 
        
        let currentSpeed = Math.min(dynamicBaseSpeed * speedMult, CONFIG.SPEED_HARD_CAP); 

        let currentDive = this.shark.isParalyzed ? CONFIG.DIVE_FORCE * 0.3 : CONFIG.DIVE_FORCE;
        let currentBuoyancy = this.shark.isParalyzed ? CONFIG.BUOYANCY * 0.3 : CONFIG.BUOYANCY;

        if (this.isPressing) this.shark.velocity += currentDive;
        else this.shark.velocity -= currentBuoyancy;
        
        this.shark.velocity = Math.max(-CONFIG.MAX_VELOCITY, Math.min(CONFIG.MAX_VELOCITY, this.shark.velocity));
        this.shark.y += this.shark.velocity;

        if (this.shark.y - this.shark.radius < 0 || this.shark.y + this.shark.radius > cvsH) { this.triggerGameOver(); return; }

        let spawnInterval = Math.max(50, 120 - Math.floor(this.score / 20));
        
        if (this.frameCount % spawnInterval === 0 && this.frameCount > 200) {
            let type = (this.score > 100 && Math.random() > 0.5) ? 'top' : 'bottom';
            let height = Math.random() * 80 + 40; 
            this.obstacles.push({ x: cvsW, y: type === 'top' ? 0 : cvsH - height, width: 35, height: height, type: type, passed: false });
        }
        if (this.frameCount % 70 === 0) this.fishes.push({ x: cvsW, y: Math.random() * (cvsH - 120) + 60, radius: 4, active: true });
        if (this.frameCount % 180 === 0 && this.score > 200) this.jellyfishes.push({ x: cvsW, y: Math.random() * (cvsH - 180) + 90, radius: 16, offset: Math.random() * Math.PI * 2 });
        if (this.frameCount > 300 && this.frameCount % 480 === 0 && Math.random() > 0.3) this.currentZones.push({ x: cvsW, y: Math.random() * (cvsH - 160) + 40, w: 1800, h: 90 });

        for(let i = this.currentZones.length - 1; i >= 0; i--) {
            this.currentZones[i].x -= dynamicBaseSpeed * 1.5; 
            if (this.currentZones[i].x + this.currentZones[i].w < 0) this.currentZones.splice(i, 1);
        }
        this.planks.forEach(p => { p.x -= p.speed * speedMult * (dynamicBaseSpeed / CONFIG.INITIAL_SPEED); if(p.x < 0) p.x = cvsW; });

        if (this.shark.isDashing) {
            this.shark.dashTimer--;
            if (this.shark.dashTimer <= 0) { this.shark.isDashing = false; this.shark.huntPoints = 0; }
        }

        if (this.shark.inCurrent && this.frameCount % 10 === 0) this.score += 2;

        for (let i = this.jellyfishes.length - 1; i >= 0; i--) {
            let jelly = this.jellyfishes[i];
            jelly.x -= currentSpeed * 0.7; jelly.y += Math.sin(this.frameCount * 0.05 + jelly.offset) * 1.5; 
            let dist = Math.hypot(sharkCX - jelly.x, sharkCY - jelly.y);
            if (dist < this.shark.radius + jelly.radius) {
                this.jellyfishes.splice(i, 1); 
                if (isInvincible) { this.audio.play('smash'); this.score += 20; } 
                else { this.audio.play('shock'); this.shark.isParalyzed = true; this.shark.paralyzeTimer = 90; }
            } else if (jelly.x + jelly.radius < 0) { this.jellyfishes.splice(i, 1); }
        }
        
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            let obs = this.obstacles[i]; obs.x -= currentSpeed;
            if (this.checkCollision(sharkCX, sharkCY, this.shark.radius, obs.x, obs.y, obs.width, obs.height)) {
                if (isInvincible) { this.obstacles.splice(i, 1); this.audio.play('smash'); this.score += (this.shark.inCurrent ? 30 : 15); continue; } 
                else { this.triggerGameOver(); return; }
            }
            if (!obs.passed && obs.x + obs.width < this.shark.x) { obs.passed = true; this.score += (this.shark.inCurrent ? 20 : 10); }
            if (obs.x + obs.width < 0) this.obstacles.splice(i, 1);
        }

        let mouthX = this.shark.x + this.shark.width - 5; let mouthY = this.shark.y;
        for (let i = this.fishes.length - 1; i >= 0; i--) {
            let fish = this.fishes[i]; fish.x -= currentSpeed * 0.85;
            if (fish.active && Math.hypot(fish.x - mouthX, fish.y - mouthY) < 25) {
                fish.active = false; this.audio.play('eat');
                if (!this.shark.isDashing) {
                    this.shark.huntPoints += 25; 
                    if (this.shark.huntPoints >= 100) { this.shark.isDashing = true; this.shark.dashTimer = 120; this.audio.play('dash'); }
                }
            }
            if (fish.x < 0) this.fishes.splice(i, 1);
        }

        this.ui.update(this.score, this.shark, this.highScore);
    }

    loop(currentTime) {
        requestAnimationFrame((time) => this.loop(time));

        if (this.state === 'PLAYING') {
            if (!this.lastTime) this.lastTime = currentTime;
            let deltaTime = currentTime - this.lastTime;
            this.lastTime = currentTime;

            if (deltaTime > 250) deltaTime = 250; 
            this.accumulator += deltaTime;

            let hasUpdated = false;
            while (this.accumulator >= CONFIG.FRAME_TIME) {
                this.updateLogic();
                this.accumulator -= CONFIG.FRAME_TIME;
                hasUpdated = true;
            }

            if (hasUpdated) this.renderer.draw(this);
        } else if (this.state === 'READY') {
            this.renderer.draw(this);
        }
    }
}

const game = new GameEngine();
</script>
